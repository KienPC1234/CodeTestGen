<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XML Testcase Viewer</title>
  <!-- Bootstrap CSS từ thư mục cục bộ -->
  <link href="Stuff/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Stuff/animate.css/package/animate.min.css">
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="Stuff/monaco-editor/package/min/vs/editor/editor.main.css">
  <style>
    body {
      background-color: #f8f9fa;
      color: #212529;
      transition: background-color 0.5s ease, color 0.5s ease;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }
    .container-full {
      width: 100%;
      height: 100vh;
      padding: 20px 40px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .row-full {
      flex-grow: 1;
      display: flex;
      width: 100%;
      margin: 0;
      gap: 20px;
      overflow: hidden;
      flex-wrap: nowrap; /* Ngăn cột xuống dòng */
    }
    .toggle-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }
    .toggle-btn {
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 20px;
      transition: transform 0.3s ease, background-color 0.3s ease;
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      color: #343a40;
    }
    body.dark-mode .toggle-btn {
      background-color: #444;
      border-color: #666;
      color: #ffffff;
    }
    .toggle-btn:hover {
      transform: scale(1.1);
    }
    .testcase-tree-container {
      height: calc(100% - 40px);
      overflow-y: auto;
    }
    .testcase-tree {
      background-color: #ffffff;
      border: 1px solid #ced4da;
      border-radius: 12px;
      padding: 15px;
      transition: background-color 0.5s ease, border-color 0.5s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      min-height: 100%;
      width: 100%;
      box-sizing: border-box; /* Quản lý padding tốt hơn */
    }
    .dark-mode .testcase-tree {
      background-color: #1e1e1e;
      border-color: #444;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .testcase-tree:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    .dark-mode .testcase-tree:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .testcase-tree ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .testcase-tree li {
      padding: 12px 15px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s ease, transform 0.2s ease, padding-left 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 500;
      white-space: nowrap; /* Ngăn văn bản xuống dòng */
    }
    .testcase-tree li:before {
      content: "📄";
      font-size: 18px;
    }
    .testcase-tree li:hover {
      background-color: #f1f3f5;
      transform: translateX(8px);
      padding-left: 20px;
    }
    .dark-mode .testcase-tree li:hover {
      background-color: #2c2c2c;
    }
    .testcase-tree .selected {
      background-color: #007bff;
      color: #ffffff;
      transform: translateX(8px);
      padding-left: 20px;
    }
    .dark-mode .testcase-tree .selected {
      background-color: #0056b3;
    }
    .testcase-tree .no-data {
      padding: 15px;
      text-align: center;
      color: #6c757d;
      font-style: italic;
    }
    .dark-mode .testcase-tree .no-data {
      color: #adb5bd;
    }
    .testcase-editor-container {
      height: calc(100% - 40px);
      border: 1px solid #ced4da;
      border-radius: 12px;
      background-color: #ffffff;
      transition: background-color 0.5s ease, border-color 0.5s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 0; /* Loại bỏ padding để Monaco chiếm toàn bộ không gian */
      overflow: hidden; /* Ngăn tràn nội dung */
    }
    .dark-mode .testcase-editor-container {
      background-color: #1e1e1e;
      border-color: #444;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .testcase-editor-container:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    .dark-mode .testcase-editor-container:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    #testcaseEditor {
      width: 100%;
      height: 100%;
    }
    /* Custom Scrollbar cho treeview */
    .testcase-tree-container::-webkit-scrollbar {
      width: 8px;
    }
    .testcase-tree-container::-webkit-scrollbar-track {
      background: #f1f3f5;
      border-radius: 12px;
    }
    .dark-mode .testcase-tree-container::-webkit-scrollbar-track {
      background: #2c2c2c;
    }
    .testcase-tree-container::-webkit-scrollbar-thumb {
      background: #007bff;
      border-radius: 12px;
      transition: background 0.3s ease;
    }
    .testcase-tree-container::-webkit-scrollbar-thumb:hover {
      background: #0056b3;
    }
    .dark-mode .testcase-tree-container::-webkit-scrollbar-thumb {
      background: #00d4ff;
    }
    .dark-mode .testcase-tree-container::-webkit-scrollbar-thumb:hover {
      background: #007bff;
    }
    h2 {
      font-weight: 700;
      background: linear-gradient(90deg, #007bff, #00d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 20px;
    }
    .dark-mode h2 {
      background: linear-gradient(90deg, #00d4ff, #007bff);
      -webkit-background-clip: text;
      background-clip: text;
    }
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
    }
    .loading-screen.active {
      opacity: 1;
      visibility: visible;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #f3f3f3;
      border-top: 6px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container-full animate__animated animate__fadeIn">
    <h2 class="text-center animate__animated animate__zoomIn">📦 XML Testcase Viewer</h2>
    <div class="row-full">
      <div class="col-3 animate__animated animate__fadeInLeft animate__delay-1s">
        <label class="form-label">Danh sách Testcase:</label>
        <div class="testcase-tree-container">
          <div class="testcase-tree" id="testcaseTree"></div>
        </div>
      </div>
      <div class="col-9 animate__animated animate__fadeInRight animate__delay-1s">
        <label class="form-label">Nội dung Testcase:</label>
        <div class="testcase-editor-container d-none" id="testcaseEditorContainer">
          <div id="testcaseEditor"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toggle-container animate__animated animate__bounceIn animate__delay-2s">
    <button class="toggle-btn" onclick="toggleDarkMode()">☀️</button>
  </div>

  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
  </div>

  <script src="Stuff/monaco-editor/package/min/vs/loader.js"></script>
  <script>
    let isDarkMode = false;
    let testcases = [];
    let selectedIndex = -1;
    let xmlString = "";
    let monacoEditor = null;

    require.config({ paths: { 'vs': 'Stuff/monaco-editor/package/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      monacoEditor = monaco.editor.create(document.getElementById('testcaseEditor'), {
        value: '',
        language: 'plaintext',
        theme: isDarkMode ? 'vs-dark' : 'vs',
        automaticLayout: true,
      });

      monacoEditor.onDidChangeModelContent(() => {
        if (selectedIndex >= 0) {
          testcases[selectedIndex].content = monacoEditor.getValue();
        }
      });
    });

    function toggleDarkMode(forceDark = null) {
      isDarkMode = forceDark !== null ? forceDark : !isDarkMode;
      document.body.classList.toggle('dark-mode', isDarkMode);
      document.querySelector('.toggle-btn').textContent = isDarkMode ? '🌙' : '☀️';
      if (monacoEditor) {
        monacoEditor.updateOptions({ theme: isDarkMode ? 'vs-dark' : 'vs' });
      }
    }

    function loadTestcasesFromXmlString(xmlString) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlString, "text/xml");
      if (xmlDoc.getElementsByTagName("parsererror").length) {
        console.error("Error parsing XML");
        return;
      }
      testcases = Array.from(xmlDoc.getElementsByTagName("testcase")).map(tc => ({
        case: tc.getAttribute("case"),
        content: tc.textContent.trim()
      }));

      const tree = document.getElementById("testcaseTree");
      if (testcases.length === 0) {
        tree.innerHTML = '<div class="no-data">Vui lòng chờ để code lấy dữ liệu testcase</div>';
      } else {
        tree.innerHTML = '<ul>' + testcases.map((tc, index) => 
          `<li onclick="selectTestcase(${index})">Testcase ${tc.case}</li>`
        ).join('') + '</ul>';
      }

      selectedIndex = -1;
      document.getElementById("testcaseEditorContainer").classList.add("d-none");
    }

    function selectTestcase(index) {
      if (index >= 0 && testcases[index]) {
        selectedIndex = index;
        const treeItems = document.querySelectorAll("#testcaseTree li");
        treeItems.forEach(item => item.classList.remove("selected"));
        treeItems[index].classList.add("selected");
        const editorContainer = document.getElementById("testcaseEditorContainer");
        editorContainer.classList.remove("d-none");
        if (monacoEditor) {
          monacoEditor.setValue(testcases[index].content);
        }
      }
    }

    function GetXML() {
      if (testcases.length === 0) return '<?xml version="1.0" encoding="utf-8"?>' + xmlString;
      const xmlDoc = document.implementation.createDocument("", "", null);
      const root = xmlDoc.createElement("testcases");
      testcases.forEach(tc => {
        const node = xmlDoc.createElement("testcase");
        node.setAttribute("case", tc.case);
        node.textContent = tc.content;
        root.appendChild(node);
      });
      xmlDoc.appendChild(root);
      const serializer = new XMLSerializer();
      const xmlContent = serializer.serializeToString(xmlDoc);
      return '<?xml version="1.0" encoding="utf-8"?>\n' + xmlContent;
    }

    function loadXMLData(data) {
      xmlString = data;
      const loadingScreen = document.getElementById('loadingScreen');
      if (xmlString.length > 1000000) {
        loadingScreen.classList.add('active');
        setTimeout(() => {
          loadTestcasesFromXmlString(xmlString);
          loadingScreen.classList.remove('active');
        }, 50);
      } else {
        loadTestcasesFromXmlString(xmlString);
      }
    }

    loadTestcasesFromXmlString("");
  </script>

  <script src="Stuff/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
