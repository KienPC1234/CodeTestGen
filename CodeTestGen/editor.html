<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor</title>
    <link href="Stuff/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Stuff/animate.css/package/animate.min.css">
    <script>
        var require = { paths: { 'vs': 'Stuff/monaco-editor/package/min/vs' } };
    </script>
    <script src="Stuff/monaco-editor/package/min/vs/loader.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #f8f9fa;
            color: #212529;
            transition: background 0.3s, color 0.3s;
            overflow: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

            html::-webkit-scrollbar, body::-webkit-scrollbar {
                display: none;
            }

        .dark-mode {
            background-color: #1e1e1e;
            color: #ffffff;
        }

        .container-full {
            width: 100%;
            max-width: none;
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .controls {
            padding: 1rem 1rem 0.5rem;
            flex-shrink: 0;
        }

        .editor-container {
            width: 100%;
            flex-grow: 1;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        .dark-mode .editor-container {
            border-color: #444;
        }

        .form-select {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ccc;
        }

        .dark-mode .form-select {
            background-color: #2e2e2e;
            color: #ffffff;
            border: 1px solid #555;
        }

        .monaco-editor .suggest-widget {
            background: #ffffff !important;
            color: #000000 !important;
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
            opacity: 0;
            transform: translateY(10px);
        }
        .dark-mode .monaco-editor .suggest-widget {
            background: #2e2e2e !important;
            color: #ffffff !important;
        }

        .monaco-editor .suggest-widget[style*="display: block"] {
            opacity: 1;
            transform: translateY(0);
        }

        .controls {
            animation: fadeInDown 0.5s ease-in-out;
        }

        .editor-container {
            animation: fadeInUp 0.5s ease-in-out;
        }

        .form-select, .form-check-input {
            animation: zoomIn 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container-full">
        <div class="controls d-flex justify-content-between align-items-center animate__animated animate__fadeInDown">
            <div>
                <label class="fw-bold me-2">Language</label>
                <select id="language" class="form-select d-inline-block w-auto animate__animated animate__zoomIn">
                    <option value="python" selected>Python</option>
                    <option value="cpp">C++</option>
                    <option value="pascal">Pascal</option>
                </select>
            </div>
            <div class="d-flex align-items-center">
                <label class="fw-bold me-2">Dark Mode</label>
                <input id="themeToggle" class="form-check-input animate__animated animate__zoomIn" type="checkbox" style="margin-bottom: 2px;">
            </div>
        </div>
        <div id="editor" class="editor-container animate__animated animate__fadeInUp"></div>
    </div>

    <script src="Stuff/Editor.js">
    </script>
</body>
</html>
